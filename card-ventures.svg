<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111722"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs><rect width="900" height="700" rx="12" fill="url(#bg)"/><rect x="0.5" y="0.5" width="899" height="699" rx="12" fill="none" stroke="#30363d" stroke-width="1"/><line x1="0" y1="30" x2="900" y2="30" stroke="#30363d"/><circle cx="20" cy="15.0" r="5" fill="#ff5f56"/><circle cx="36" cy="15.0" r="5" fill="#ffbd2e"/><circle cx="52" cy="15.0" r="5" fill="#27c93f"/><text x="450.0" y="19.0" fill="#7d8590" font-size="12" text-anchor="middle">gabriel@github: ~/ventures$ ls --all</text><g><text x="20" y="60.0" fill="#7d8590" font-size="13">$ </text><text x="36" y="60.0" fill="#f2cc60" font-size="13.5" font-weight="700">Projeto Candela</text><text x="189.0" y="60.0" fill="#7d8590" font-size="12">- Registered NGO with the Federal University of Bahia</text><text x="880" y="60.0" fill="#7d8590" font-size="11.5" text-anchor="end">2023 - Present</text></g><g><circle cx="40" cy="73.0" r="2.4" fill="#f2cc60"/><text x="52" y="77.0" fill="#c9d1d9" font-size="12">Founder &amp; lead engineer: kit design, fundraising &amp; partners</text></g><g><circle cx="40" cy="90.0" r="2.4" fill="#f2cc60"/><text x="52" y="94.0" fill="#c9d1d9" font-size="12">140 low-cost physics lab kits in 28 public schools with no lab | 3K+ students</text></g><g><circle cx="40" cy="107.0" r="2.4" fill="#f2cc60"/><text x="52" y="111.0" fill="#c9d1d9" font-size="12">Physics failure rate fell from 30% to 10%</text></g><g><text x="20" y="142.0" fill="#7d8590" font-size="13">$ </text><text x="36" y="142.0" fill="#ff7b72" font-size="13.5" font-weight="700">Steady-State Hypothesis</text><text x="257.79999999999995" y="142.0" fill="#7d8590" font-size="12">- Research Fellow, Instituto Principia</text><text x="880" y="142.0" fill="#7d8590" font-size="11.5" text-anchor="end">2023 - 2026</text></g><g><circle cx="40" cy="155.0" r="2.4" fill="#ff7b72"/><text x="52" y="159.0" fill="#c9d1d9" font-size="12">137-page thesis advised by 2 USP/JHU PhDs | US$3K scholarship</text></g><g><circle cx="40" cy="172.0" r="2.4" fill="#ff7b72"/><text x="52" y="176.0" fill="#c9d1d9" font-size="12">Python models of ozone depletion (CFCs) &amp; Haber-Bosch ammonia reactors</text></g><g><circle cx="40" cy="189.0" r="2.4" fill="#ff7b72"/><text x="52" y="193.0" fill="#c9d1d9" font-size="12">Off by up to 37%, &#x27;total&#x27; version within 14% | held in ~92% of 1,938 enzyme measurements</text></g><g><text x="20" y="224.0" fill="#7d8590" font-size="13">$ </text><text x="36" y="224.0" fill="#22d3ee" font-size="13.5" font-weight="700">Science Olympiad Club</text><text x="240.6" y="224.0" fill="#7d8590" font-size="12">- President, Colegio Militar de Salvador</text><text x="880" y="224.0" fill="#7d8590" font-size="11.5" text-anchor="end">2022 - 2024</text></g><g><circle cx="40" cy="237.0" r="2.4" fill="#22d3ee"/><text x="52" y="241.0" fill="#c9d1d9" font-size="12">400+ members (57% of the school) | VP, Math Division Head, Army liaison</text></g><g><circle cx="40" cy="254.0" r="2.4" fill="#22d3ee"/><text x="52" y="258.0" fill="#c9d1d9" font-size="12">Coached 215 students: ~60 won national gold or silver</text></g><g><text x="20" y="289.0" fill="#7d8590" font-size="13">$ </text><text x="36" y="289.0" fill="#3fb950" font-size="13.5" font-weight="700">Anisio Teixeira Initiative</text><text x="283.6" y="289.0" fill="#7d8590" font-size="12">- Free olympiad prep for low-income students in Salvador</text><text x="880" y="289.0" fill="#7d8590" font-size="11.5" text-anchor="end">2023 - 2024</text></g><g><circle cx="40" cy="302.0" r="2.4" fill="#3fb950"/><text x="52" y="306.0" fill="#c9d1d9" font-size="12">Founder &amp; president, team of 9 volunteers | 8 schools, 678 students</text></g><g><circle cx="40" cy="319.0" r="2.4" fill="#3fb950"/><text x="52" y="323.0" fill="#c9d1d9" font-size="12">25 national medals (4 gold)</text></g><g><text x="20" y="354.0" fill="#7d8590" font-size="13">$ </text><text x="36" y="354.0" fill="#58a6ff" font-size="13.5" font-weight="700">National Physics Competition</text><text x="300.79999999999995" y="354.0" fill="#7d8590" font-size="12">- Co-creator, free olympiad open to all of Brazil</text><text x="880" y="354.0" fill="#7d8590" font-size="11.5" text-anchor="end">2024 - 2025</text></g><g><circle cx="40" cy="367.0" r="2.4" fill="#58a6ff"/><text x="52" y="371.0" fill="#c9d1d9" font-size="12">4-stage mock olympiad for students with no school lab: 26 states, 2K students</text></g><g><circle cx="40" cy="384.0" r="2.4" fill="#58a6ff"/><text x="52" y="388.0" fill="#c9d1d9" font-size="12">40 simulated-experiment problems</text></g><g><text x="20" y="419.0" fill="#7d8590" font-size="13">$ </text><text x="36" y="419.0" fill="#58a6ff" font-size="13.5" font-weight="700">Principia Alumni Association</text><text x="300.79999999999995" y="419.0" fill="#7d8590" font-size="12">- Vice President</text><text x="880" y="419.0" fill="#7d8590" font-size="11.5" text-anchor="end">2023 - Present</text></g><g><circle cx="40" cy="432.0" r="2.4" fill="#58a6ff"/><text x="52" y="436.0" fill="#c9d1d9" font-size="12">94 members | founded the Hackathon Club | hosted 7 PhD talks</text></g><g><circle cx="40" cy="449.0" r="2.4" fill="#58a6ff"/><text x="52" y="453.0" fill="#c9d1d9" font-size="12">Co-led fundraising: ~US$60K | interviewed 32 applicants</text></g><g><text x="20" y="484.0" fill="#7d8590" font-size="13">$ </text><text x="36" y="484.0" fill="#58a6ff" font-size="13.5" font-weight="700">Budgeting Tools RCT</text><text x="223.4" y="484.0" fill="#7d8590" font-size="12">- Research Fellow in Behavioral Economics, Fundacao Estudar</text><text x="880" y="484.0" fill="#7d8590" font-size="11.5" text-anchor="end">2025 - 2026</text></g><g><circle cx="40" cy="497.0" r="2.4" fill="#58a6ff"/><text x="52" y="501.0" fill="#c9d1d9" font-size="12">3-month randomized experiment, n=208 public-school olympiad medalists (ages 11-18)</text></g><g><circle cx="40" cy="514.0" r="2.4" fill="#58a6ff"/><text x="52" y="518.0" fill="#c9d1d9" font-size="12">Reported saving rose from 44% to 91-101% of disposable income (~R$71/month)</text></g><g><circle cx="40" cy="531.0" r="2.4" fill="#58a6ff"/><text x="52" y="535.0" fill="#c9d1d9" font-size="12">Then audited my own result: data can&#x27;t separate money saved from changed reporting</text></g><g><circle cx="40" cy="548.0" r="2.4" fill="#58a6ff"/><text x="52" y="552.0" fill="#c9d1d9" font-size="12">175-page open-code monograph with the follow-up design | advised by Aaron Litvin, Ph.D. (Harvard)</text></g><g><text x="20" y="583.0" fill="#7d8590" font-size="13">$ </text><text x="36" y="583.0" fill="#3fb950" font-size="13.5" font-weight="700">GSAT Education</text><text x="180.39999999999998" y="583.0" fill="#7d8590" font-size="12">- Test-prep platform built from scratch</text><text x="880" y="583.0" fill="#7d8590" font-size="11.5" text-anchor="end">Nov 2025 - May 2026</text></g><g><circle cx="40" cy="596.0" r="2.4" fill="#3fb950"/><text x="52" y="600.0" fill="#c9d1d9" font-size="12">Product, engineering and go-to-market</text></g><g><text x="20" y="631.0" fill="#7d8590" font-size="13">$ </text><text x="36" y="631.0" fill="#7d8590" font-size="13.5" font-weight="700">Refurbished Laptops</text><text x="223.4" y="631.0" fill="#7d8590" font-size="12">- Online store, self-taught repair since 7th grade</text><text x="880" y="631.0" fill="#7d8590" font-size="11.5" text-anchor="end">2022 - 2026</text></g><g><circle cx="40" cy="644.0" r="2.4" fill="#7d8590"/><text x="52" y="648.0" fill="#c9d1d9" font-size="12">121 laptops fixed for clients &amp; resale, shipped to 21 of Brazil&#x27;s 26 states</text></g><g><circle cx="40" cy="661.0" r="2.4" fill="#7d8590"/><text x="52" y="665.0" fill="#c9d1d9" font-size="12">US$7K earned to pay olympiad courses, fund Candela &amp; help at home</text></g></svg>